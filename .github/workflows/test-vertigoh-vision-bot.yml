name: Test Vertigoh Vision Bot

on:
  push:
    branches:
      - main
    paths:
      - 'services/vertigoh-vision-bot/**'
      - '.github/workflows/test-vertigoh-vision-bot.yml'
  pull_request:
    paths:
      - 'services/vertigoh-vision-bot/**'

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: services/vertigoh-vision-bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: services/vertigoh-vision-bot
        run: |
          pytest tests/ -v
